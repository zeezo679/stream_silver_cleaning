# Jars are resolved on first run (needs internet), then cached in the ivy-cache volume.
spark.jars.ivy                       /opt/ivy
spark.jars.packages                  org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,io.delta:delta-spark_2.12:3.2.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
 
# Delta
spark.sql.extensions                 io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog      org.apache.spark.sql.delta.catalog.DeltaCatalog
 
# S3A (unused in local mode; keys come from env vars in .env). Stockholm region.
spark.hadoop.fs.s3a.impl             org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint         s3.eu-north-1.amazonaws.com
spark.hadoop.fs.s3a.aws.credentials.provider  com.amazonaws.auth.DefaultAWSCredentialsProviderChain
spark.hadoop.fs.s3a.path.style.access false
 
# Small local shuffle for dev-size data
spark.sql.shuffle.partitions         8
spark.sql.session.timeZone           UTC
