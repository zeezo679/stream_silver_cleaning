# Local sandbox: Kafka (KRaft, no Zookeeper) + PySpark with Kafka/Delta/S3A jars preloaded.
# Up:    docker compose up -d --build
# Shell: docker compose exec spark bash
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "29092:29092"   # host access: localhost:29092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # One-shot: creates topics, then exits. Topic names are placeholders until M1 confirms.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in meter.readings transformer.readings sim.truth; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  spark:
    build: ./spark
    container_name: spark
    user: root
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env            # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (gitignored); can be empty in local mode
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      LAKE_ENV: local              # local | s3
    ports:
      - "4041:4040"     # Spark UI of the running job
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./work:/workspace          # your PySpark code
      - ./output:/data             # generator output (jsonl + grid csv)
      - ./lake:/lake               # local stand-in for the S3 bucket
      - ivy-cache:/opt/ivy         # jars downloaded once, reused across restarts
    working_dir: /workspace
    command: ["sleep", "infinity"]

volumes:
  kafka-data:
  ivy-cache: